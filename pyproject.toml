[project]
name = "func-sketch"
version = "0.2.0"
description = "A graphing calculator currently in development."
readme = "README.md"
authors = [
    { name = "Kenta Kabashima", email = "kenta_program37@hotmail.co.jp" },
]
license = "Apache-2.0"
requires-python = ">=3.13,<3.15"
dependencies = [
    "numpy (>=2.5.2,<3.0.0)",
    "kivy[base] (>=2.3.1,<3.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
]

[project.scripts]
func_sketch = "func_sketch._main:main"

[build-system]
requires = ["scikit-build-core (>=1.0,<2.0)", "nanobind (>=2.15.0,<3.0.0)"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "1.0"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"

[tool.scikit-build.sdist]
inclusion-mode = "explicit"
exclude = ["__pycache__"]
include = [
    "pyproject.toml",
    "README.md",
    "LICENSE.txt",
    "CMakeLists.txt",
    "vcpkg.json",
    "vcpkg-configuration.json",
    "cpp/CMakeLists.txt",
    "cpp/cmake",
    "cpp/include",
    "cpp/src",
    "src",
]

[dependency-groups]
doc = [
    "sphinx (>=9.1.0,<10.0.0)",
    "sphinx-orange-book-theme (>=0.21.0,<0.22.0)",
    "myst-parser (>=5.1.0,<6.0.0)",
    "sphinxcontrib-plantuml (>=0.31,<0.32)",
    "myst-nb (>=1.4.0,<2.0.0)",
    "jupyterlab (>=4.6.3,<5.0.0)",
    "ipywidgets (>=8.1.9,<9.0.0)",
    "ipython (>=9.16.1,<10.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "colour-science (>=0.4.7,<0.5.0)",
    "plotly (>=7.0.0,<8.0.0)",
    "opencv-python (>=5.0.0.93,<6.0.0.0)",
]
dev = [
    "pre-commit (>=4.6.2,<5.0.0)",
    "black[jupyter] (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "cmakelang (>=0.6.13,<0.7.0)",
    "doc8 (>=2.0.0,<3.0.0)",
    "sphinx-autobuild (>=2025.8.25,<2026.0.0)",
    "lcov-cobertura (>=2.1.1,<3.0.0)",
    "types-docutils (>=0.22.3.20260724,<0.23.0.0)",
    "clang-tidy-checker (>=0.7.0,<0.8.0)",
    "scipy-stubs (>=1.18.1.0,<2.0.0.0)",
    "ruff (>=0.16.5,<0.17.0)",
]
bind = ["nanobind (>=2.15.0,<3.0.0)"]
test = [
    "matplotlib (>=3.11.1,<4.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "scikit-image (>=0.26.0,<0.27.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-benchmark (>=5.3.0,<6.0.0)",
]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    # "CPY" # TODO Enable after fix.
    "EXE",
    "LOG",
    "G",
    "PIE",
    "PT",
    "SIM",
    "PTH",
    "N",
    "PERF",
    "E",
    "W",
    "DOC",
    "D",
    "F",
    "PLC",
    "PLE",
    "UP",
]
ignore = ["E501", "PTH123", "DOC501", "PLC2701"]
preview = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.isort]
profile = "black"
