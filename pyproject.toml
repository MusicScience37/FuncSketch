[project]
name = "func-sketch"
version = "0.1.0"
description = ""
authors = [
    { name = "Kenta Kabashima", email = "kenta_program37@hotmail.co.jp" },
]
license = "Apache-2.0"
requires-python = ">=3.13,<3.15"
dependencies = [
    "numpy (>=2.5.2,<3.0.0)",
    "kivy[base] (>=2.3.1,<3.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
]

[project.scripts]
func_sketch = "func_sketch._main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
doc = [
    "sphinx (>=9.1.0,<10.0.0)",
    "sphinx-orange-book-theme (>=0.21.0,<0.22.0)",
    "myst-parser (>=5.1.0,<6.0.0)",
    "sphinxcontrib-plantuml (>=0.31,<0.32)",
    "myst-nb (>=1.4.0,<2.0.0)",
    "jupyterlab (>=4.6.3,<5.0.0)",
    "ipywidgets (>=8.1.9,<9.0.0)",
    "ipython (>=9.16.1,<10.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "colour-science (>=0.4.7,<0.5.0)",
    "plotly (>=7.0.0,<8.0.0)",
    "opencv-python (>=5.0.0.93,<6.0.0.0)",
]
dev = [
    "pre-commit (>=4.6.2,<5.0.0)",
    "black[jupyter] (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "pylint (>=4.0.7,<5.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "cmakelang (>=0.6.13,<0.7.0)",
    "doc8 (>=2.0.0,<3.0.0)",
    "sphinx-autobuild (>=2025.8.25,<2026.0.0)",
    "lcov-cobertura (>=2.1.1,<3.0.0)",
    "types-docutils (>=0.22.3.20260724,<0.23.0.0)",
    "clang-tidy-checker (>=0.7.0,<0.8.0)",
    "scipy-stubs (>=1.18.1.0,<2.0.0.0)",
]
bind = ["nanobind (>=2.15.0,<3.0.0)"]
test = [
    "matplotlib (>=3.11.1,<4.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "scikit-image (>=0.26.0,<0.27.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-benchmark (>=5.3.0,<6.0.0)",
]

[tool.pylint.main]
disable = "too-many-instance-attributes,line-too-long,fixme,too-few-public-methods,redefined-outer-name,redefined-builtin,too-many-arguments,no-member,use-implicit-booleaness-not-comparison,too-many-public-methods,too-many-locals"
load-plugins = "pylint.extensions.docparams"
extension-pkg-whitelist = [
    "kivy.graphics",
    "kivy.properties",
    "kivy.app",
    "func_sketch._cpp",
]
generated-members = [
    "kivy.properties",
    "kivy.graphics",
    "kivy.app",
    "func_sketch._cpp",
]
ignored-modules = [
    "kivy.properties",
    "kivy.graphics",
    "kivy.app",
    "func_sketch._cpp",
]

[tool.isort]
profile = "black"
