[project]
name = "func-sketch"
version = "0.1.0"
description = ""
authors = [
    { name = "Kenta Kabashima", email = "kenta_program37@hotmail.co.jp" },
]
license = "Apache-2.0"
requires-python = ">=3.13,<3.15"
dependencies = []

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
doc = [
    "sphinx (>=9.1.0,<10.0.0)",
    "sphinx-orange-book-theme (>=0.21.0,<0.22.0)",
    "myst-parser (>=5.1.0,<6.0.0)",
]
dev = [
    "pre-commit (>=4.6.1,<5.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "pylint (>=4.0.6,<5.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "cmakelang (>=0.6.13,<0.7.0)",
    "doc8 (>=2.0.0,<3.0.0)",
    "sphinx-autobuild (>=2025.8.25,<2026.0.0)",
]

[tool.pylint.main]
disable = "too-many-instance-attributes,line-too-long,fixme,too-few-public-methods,redefined-outer-name,redefined-builtin,too-many-arguments"
load-plugins = "pylint.extensions.docparams"

[tool.isort]
profile = "black"
